# ------------------- General Options -------------------------
description                  : Correlated FlowMatching
results_root_dir             : results_eth_ucy
dataset                      : eth_ucy

# ------------------- Dataset -------------------------
past_frames                  : 8 
future_frames                : 12
agents                       : 2

checkpt_freq                 : 10

# -------------------- Flow matching config -----------------------------
denoising_method             : 'fm'
sampling_steps               : 10
t_schedule                   : 'logit_normal'
objective                    : 'pred_data'
sigma_data                   : 0.13

# -------------------- Logger config -----------------------------
notes                        : 'Flow Matching'


# ---------------------------- Configurations for model ----------------------------
MODEL:
    NUM_PROPOSED_QUERY: 20
    MODEL_OUT_DIM: 24
    REGRESSION_MLPS: [128, 256, 24]
    CLASSIFICATION_MLPS: [128, 128, 1]

    CONTEXT_ENCODER:
        NAME: ETHEncoder
        NUM_INPUT_CONTEXT: 6
        AGENTS: 2
        
        NUM_CHANNEL_IN_MLP_AGENT: 256
        NUM_LAYER_IN_MLP_AGENT: 3

        D_MODEL: 128
        NUM_ATTN_LAYERS: 4
        NUM_ATTN_HEAD: 8 
        DROPOUT_OF_ATTN: 0.1 

        # --- variant A (per-timestep concat) ---
        USE_VIDEO: True            # set False to fall back to upstream behaviour
        VIDEO_DIM_RAW: 512         # ResNet18 pooled feature dim — must match cached .npy
        VIDEO_DIM: 32              # projected dim concatenated to traj_channels (6)
        PAST_FRAMES: 8             # MUST match cfg.past_frames at top level
        TRAJ_CHANNELS: 6           # abs_xy + rel_xy + vel_xy
        VIDEO_FEATURES_ROOT: "features/resnet18"

        # --- agent-centric video and tri-modal fusion ---
        USE_AGENT_VIDEO: False     # set True to enable agent-centric video encoder
        USE_TRI_MODAL_FUSION: False # set True to enable tri-modal cascaded cross-attention fusion
        AGENT_CROP_SIZE: [64, 64]  # [height, width] for agent-centric crops
        RESNET_FREEZE_BLOCKS: 2    # number of initial ResNet blocks to freeze
        SPATIAL_DROPOUT_RATE: 0.5  # dropout rate after backbone features
 
    MOTION_DECODER:
        NAME: MTRDecoder
        D_MODEL: 128
        NUM_DECODER_BLOCKS: 4 
        NUM_ATTN_HEAD: 8
        DROPOUT_OF_ATTN: 0.1


denoising_head_preds         : 20
k_preds                      : 20

# ------------------------------- Optimizer Parameters ---------------------------------
train_batch_size             : 128
test_batch_size              : 1024

OPTIMIZATION:
    NUM_EPOCHS: 150

    OPTIMIZER: AdamW
    LR: 0.0001
    WEIGHT_DECAY: 0.01

    SCHEDULER: cosineAnnealingLRwithWarmup
    LR_CLIP: 0.000001

    GRAD_NORM_CLIP: 1.0

    LOSS_WEIGHTS: {
      'cls': 1.0, 
      'reg': 1.0, 
      'vel': 0.2,
    }
