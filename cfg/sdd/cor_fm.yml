# ------------------- General Options -------------------------
description                  : Correlated FlowMatching
results_root_dir             : results_sdd
dataset                      : sdd

# ------------------- Dataset -------------------------
past_frames                  : 8 
future_frames                : 12
agents                       : 1

checkpt_freq                 : 10

# -------------------- Disk-budget guards (Kaggle /kaggle/working ~20 GB) -----
# save_trainer_state: keep optimizer/scheduler/scaler in checkpoints. Only
#   needed to RESUME training; the SDD pipeline never resumes, and those buffers
#   ~double each checkpoint, so SDD disables them.
# cleanup_ckpt_on_eval: delete checkpoint_last + checkpoint_epoch_* immediately
#   after an evaluation pass, keeping only checkpoint_best.pt (consumed by Q1/Q2/Q4).
save_trainer_state           : False
cleanup_ckpt_on_eval         : True

# -------------------- Validation (model selection) -------------------------
# checkpoint_best is selected on a VALIDATION split carved from the TRAINING
# scenes only (see build_val_loader_from_train); the held-out test scene is
# strictly blind. Deterministic: val_fraction + seed are fixed per experiment
# family so checkpoint selection is reproducible for Q1.
VAL_FRACTION                 : 0.1
VAL_SEED                     : 0

# -------------------- Flow matching config -----------------------------
denoising_method             : 'fm'
sampling_steps               : 10
t_schedule                   : 'logit_normal'
objective                    : 'pred_data'
sigma_data                   : 0.0663 #0.13

# -------------------- Logger config -----------------------------
notes                        : 'Flow Matching'


# ---------------------------- Configurations for model ----------------------------
MODEL:
    NUM_PROPOSED_QUERY: 20
    MODEL_OUT_DIM: 24
    REGRESSION_MLPS: [128, 256, 24]
    CLASSIFICATION_MLPS: [128, 128, 1]

    CONTEXT_ENCODER:
        NAME: ETHEncoder
        NUM_INPUT_CONTEXT: 6
        AGENTS: 1

        NUM_CHANNEL_IN_MLP_AGENT: 256
        NUM_LAYER_IN_MLP_AGENT: 3

        # ------------------- Video Configuration -------------------
        USE_VIDEO: False          # Enable global video encoder
        USE_AGENT_VIDEO: False    # Enable agent-centric video encoder
        USE_TRI_MODAL_FUSION: False # Enable tri-modal cascaded fusion
        VIDEO_DIM_RAW: 512        # Raw video feature dimension (ResNet-18)
        VIDEO_DIM: 32             # Projected video dimension
        # Cached ResNet-18 per-scene features (<scene>.npy + .manifest.parquet).
        # Writable project-local root on the lab (repo is under Desktop):
        # /home/efrei_stage/Desktop/MoFlow/features/resnet18
        # The read-only $SDD_ROOT/features/resnet18 must never be used for
        # feature loading. Research scripts override this with FEATURES_ROOT.
        VIDEO_FEATURES_ROOT: "/home/efrei_stage/Desktop/MoFlow/features/resnet18"
        AGENT_CROP_SIZE: [64, 64] # [height, width] for crops
        RESNET_FREEZE_BLOCKS: 2   # Frozen ResNet blocks
        SPATIAL_DROPOUT_RATE: 0.5 # Dropout after backbone
        AGENT_ENCODER_CHUNK_SIZE: 32  # micro-batch images per backbone forward (OOM/cuDNN guard)
        AGENT_ENCODER_TYPE: resnet18   # agent-crop backbone: resnet18 (ImageNet pretrained) | compact (lightweight, no pretrained)
        USE_VIDEO_GATING: True         # learnable kinematic+video gate (h_fused = h_kin + sigmoid(W h_vid + b) * h_vid); NOTE: adds params

        D_MODEL: 128
        NUM_ATTN_LAYERS: 4
        NUM_ATTN_HEAD: 8 
        DROPOUT_OF_ATTN: 0.1 
 
    MOTION_DECODER:
        NAME: MTRDecoder
        D_MODEL: 128
        NUM_DECODER_BLOCKS: 4 
        NUM_ATTN_HEAD: 8
        DROPOUT_OF_ATTN: 0.1


denoising_head_preds         : 20
k_preds                      : 20

# ------------------------------- Optimizer Parameters ---------------------------------
train_batch_size             : 128
# Evaluation samples denoising_head_preds (20) hypotheses per window for
# sampling_steps (10) forward passes, so its activation footprint is ~2 orders
# of magnitude above training. The old 1024 was 8x the train batch and was the
# peak-VRAM OOM source: the trainer's eval loop CATCHES per-batch OOM and skips
# the batch, so an oversized eval "succeeds" while quietly dropping windows
# (metrics then carry partial=1). 256 keeps a 2x margin over training and
# finishes the full test split without skipped batches.
test_batch_size              : 256

OPTIMIZATION:
    NUM_EPOCHS: 150

    OPTIMIZER: AdamW
    LR: 0.0001
    WEIGHT_DECAY: 0.01

    SCHEDULER: cosineAnnealingLRwithWarmup
    LR_CLIP: 0.000001

    GRAD_NORM_CLIP: 1.0

    LOSS_WEIGHTS: {
      'cls': 1.0, 
      'reg': 1.0, 
      'vel': 0.2,
      'div': 0.1,  # diversity (variety) calibration: repulsion among K candidates
    }
    DIVERSITY_MARGIN: 0.25  # hinge margin (normalized units) for the variety loss
